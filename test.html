<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
            background-color: #f9fcff;
        }
        /* Highlight style for Auto-Fill testing */
        input.auto-filled {
            background-color: #e8f0fe;
            border-color: #28a745;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Student Details Form</h2>
        <p style="text-align:center; color:#888; font-size:12px; margin-top:-15px; margin-bottom:20px;">
            Open AutoForm-AI, Scan the Image, then Drag & Drop results here.
        </p>

        <form>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" placeholder="e.g. Nikhil">
            </div>

            <div class="form-group">
                <label>Middle Name</label>
                <input type="text" name="middle_name" placeholder="e.g. Grace">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" placeholder="e.g. Summer">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <input type="text" name="gender" placeholder="Female / Male">
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="text" name="dob" placeholder="DD-MM-YYYY">
            </div>

            <div class="form-group">
                <label>Address Line 1</label>
                <input type="text" name="address_line1" placeholder="Road #1, Street #2">
            </div>

            <div class="form-group">
                <label>Address Line 2</label>
                <input type="text" name="address_line2" placeholder="HSR Layout">
            </div>

            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" placeholder="Bangalore">
            </div>

            <div class="form-group">
                <label>State</label>
                <input type="text" name="state" placeholder="Karnataka">
            </div>

            <div class="form-group">
                <label>Pin Code</label>
                <input type="text" name="pincode" placeholder="560068">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone_mobile" placeholder="9987659110">
            </div>

            <div class="form-group">
                <label>Email Id</label>
                <input type="email" name="user_email" placeholder="Abigail@gmail.com">
            </div>

            <button type="submit" class="submit-btn" onclick="alert('Form Submitted! (This is a demo)'); return false;">Submit Application</button>
        </form>
    </div>

</body>
</html>
